<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin `maximum-scale`: bloquear el zoom es un incumplimiento de WCAG 1.4.4
         y deja afuera a quien necesita agrandar. Estaba para evitar que iOS
         acercara la pantalla al enfocar un campo, que es un problema con otra
         solución: los campos de texto son de 16px. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1012" />
    <!-- iOS necesita estas dos para que "Agregar a inicio" abra sin la barra
         de Safari. El estándar de PWA no alcanza en iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="birrapp" />
    <!--
      `%BASE_URL%` y no `./`.

      Estos tres archivos viven en `public/`, y Vite NO reescribe las rutas
      relativas a `public/` del index: reescribe el CSS y el manifest, y estas
      las deja como están. Con `./`, el navegador las resuelve contra la ruta
      actual, así que en la raíz funcionaban y en `/bar/123` pedían
      `/bar/favicon.svg` y daban 404. Se veía sólo en la consola y sólo dentro
      de una ficha, que es el peor lugar para que algo falle en silencio.

      `%BASE_URL%` lo reemplaza Vite por la base configurada, así que apunta al
      mismo lugar desde cualquier ruta.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" />
    <title>birrapp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
